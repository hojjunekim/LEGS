# legs-gsplat — capture -> Gaussian splat env for scripts/gsplat/video2gsplat.py
# (frame extraction, hloc SfM, nerfstudio splatfacto training + export).
#
# Kept apart from the simulator env (legs.yml): nerfstudio 1.1.4 pins
# viser==0.2.3 and gsplat==1.0.0, while the simulator needs viser 1.0.
#
#   conda env create -f gsplat.yml
#   conda activate legs-gsplat
#   python scripts/gsplat/video2gsplat.py <name> --video <capture.mov>
#
# gsplat 1.0.0 compiles its CUDA kernels on first use against the env's CUDA
# 11.8 toolkit (a few minutes, once). tiny-cuda-nn is not needed: splatfacto
# does not use it (nerfstudio only warns that it is missing).
name: legs-gsplat
channels:
  - nvidia/label/cuda-11.8.0
  - conda-forge
  - nodefaults
dependencies:
  - python=3.10
  - pip
  - cuda-toolkit=11.8
  - ninja
  - ffmpeg=8.0.0
  - colmap=3.11.1
  - pip:
      - --extra-index-url https://download.pytorch.org/whl/cu118
      - torch==2.1.2+cu118
      - torchvision==0.16.2+cu118
      - numpy==1.26.4
      - nerfstudio==1.1.4
      - pycolmap==3.12.6
      # hloc has no release for this version; pinned to the commit it was used at.
      - hloc @ git+https://github.com/cvg/Hierarchical-Localization.git@e33422019fee354b7887d05cf6deb525cfe47524
